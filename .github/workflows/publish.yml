# Publishes the package to PyPI when a version tag (e.g., v0.21.2) is pushed; see CONTRIBUTING.md.
# Authenticates with PyPI's trusted publishing, so there's no API token to store.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python -m pip install build
      - run: python -m build
      # Fails if the tag doesn't match the version in src/redivis/_version.py
      - name: Check the tag matches the package version
        run: ls "dist/redivis-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment configured for the trusted publisher on PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/redivis/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
